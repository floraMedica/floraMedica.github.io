<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070b" />
  <meta name="description" content="PyMacs — St Paul, MN USA" />
  <title>PyMacs — St Paul, MN USA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #05070b; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }

    /* Full-screen splash / background */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(72, 105, 255, .30), transparent 32%),
        radial-gradient(circle at 80% 70%, rgba(0, 214, 201, .22), transparent 35%),
        linear-gradient(135deg, #05070b 0%, #0b1020 52%, #05070b 100%);
      animation: splashOut .9s ease 2.2s forwards;
      pointer-events: none;
    }
    .splash::before {
      content: "";
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      background: conic-gradient(from 180deg, transparent, rgba(255,255,255,.08), transparent 35%);
      filter: blur(12px);
      animation: spin 10s linear infinite;
    }
    .brand {
      position: relative;
      text-align: center;
      padding: 2rem;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(3rem, 13vw, 8rem);
      line-height: .9;
      letter-spacing: -.07em;
      font-weight: 800;
    }
    .brand p {
      margin: 1rem 0 0;
      font-size: clamp(.85rem, 2vw, 1.15rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .72;
    }

    main { min-height: 100vh; padding: 1rem; }
    .frame {
      width: min(1100px, 100%);
      margin: 0 auto;
      min-height: calc(100vh - 2rem);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      background: rgba(10, 13, 20, .72);
      box-shadow: 0 20px 80px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }
    .canva {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 393.5578%;
      overflow: hidden;
    }
    .canva iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .credit {
      padding: .75rem 1rem;
      text-align: center;
      font-size: .8rem;
      background: rgba(0,0,0,.35);
    }
    .credit a { color: #fff; opacity: .75; }

    @keyframes splashOut { to { opacity: 0; visibility: hidden; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .splash { animation: none; opacity: 0; visibility: hidden; }
      .splash::before { animation: none; }
    }
  </style>
</head>
<body>
  <section class="splash" aria-label="PyMacs loading">
    <div class="brand">
      <h1>PyMacs</h1>
      <p>St Paul, MN USA</p>
    </div>
  </section>

  <main>
    <div class="frame">
      <div class="canva">
        <iframe
          loading="lazy"
          src="https://www.canva.com/design/DAHUnKtHJj4/SwXf5YN20B4-8DNf2smcbA/view?embed"
          allowfullscreen="allowfullscreen"
          allow="fullscreen"
          title="PyMacs Canva presentation">
        </iframe>
      </div>
      <div class="credit">
        <a href="https://www.canva.com/design/DAHUnKtHJj4/SwXf5YN20B4-8DNf2smcbA/view?utm_content=DAHUnKtHJj4&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener noreferrer">PyMacs</a>
        <span> · St Paul, MN USA</span>
      </div>
    </div>
  </main>
</body>
</html>
